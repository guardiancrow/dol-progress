[package]
name = "dol-progress-manager"
default-run = "dol-progress-manager"
version = "0.3.0"
description = "Local progress manager for Uncharted Waters Online"
authors = ["guardiancrow"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dol_progress_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.10.9", default-features = false }
futures-core = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
# 明示指定した隔離harnessだけに使用し、通常起動には接続しない。
consent-ui-harness = []
consent-gate-harness = []
consent-startup-harness = ["consent-gate-harness"]

[[example]]
name = "consent_native"
required-features = ["consent-ui-harness"]

[[example]]
name = "consent_gate"
required-features = ["consent-gate-harness"]

[[bin]]
name = "consent_startup"
path = "src/bin/consent_startup.rs"
required-features = ["consent-startup-harness"]

[dev-dependencies]
encoding_rs = "0.8"
tokio = { version = "1", features = ["macros", "rt"] }
# 隔離exampleの自身のGDI/USER resource計測だけに使用する。
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }
